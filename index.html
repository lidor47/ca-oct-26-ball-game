<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ball Game</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body onload="onInit()">

    <h1>The Ball Game
        <span class="moves-count">moves:
            <span class="counter"></span>
        </span>
    </h1>
    <h2 class="game-timer">00:00</h2>
    <div class="balls">
        <div class="ball1" onclick="onBallClick(this , 400)">100</div>
        <div class="ball2" onclick="onBallClick(this , 300)">100</div>
        <div class="ball3" onclick="onBall3Click()">swap balls</div>
        <div class="ball4" onclick="onBall4Click()">Reduce</div>
        <div class="ball5" onclick="onBall5Click()">Theme</div>
        <div class="ball6" onclick="onBall6Click()" onmouseenter="onMouseEnter()" onmouseleave="onMouseLeave()">Reset
        </div>
    </div>
    <button class="undo-btn" onclick="onUndo()">UNDO</button>
    <button class="redo-btn" onclick="onRedo()">REDO</button>

    <script src="js/util.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
